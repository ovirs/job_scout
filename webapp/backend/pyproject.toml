[project]
name = "job-scout"
version = "0.1.0"
description = "Job Scout webapp backend: HTTP API and background worker"
authors = [
    { name = "ovirs", email = "ovirs@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.14.0",
    "fastapi>=0.143.1",
    "procrastinate>=3.10.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.1",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "playwright>=1.64.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
    "testcontainers[postgres]>=4.15.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
markers = ["browser: drives the React app in a headless browser (deselect with -m 'not browser')"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Packages import only from the layers below them (ADR-0004); `tests/test_architecture.py`
# runs this. Keep the order in step with "Backend layout" in the README.
[tool.importlinter]
root_package = "job_scout"
# A relationship to a higher package names its class under TYPE_CHECKING only
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Packages depend downward only"
type = "layers"
containers = ["job_scout"]
exhaustive = true
# Not code the layers order: Alembic's scripts, and the LLM package, whose modules sit in
# different layers below
exhaustive_ignores = ["alembic", "llm"]
layers = [
    # Wiring: builds the app and the worker, and hands in the LLM
    "app : worker : openapi : runtime : tables : llm.anthropic_adapter : llm.fake",
    "posting_view",
    "notes | cover_letters",
    "clippings | applications",
    "triage | evaluations",
    # The posting text the LLM reads, shared by the prompts; the LLM job run lifecycle
    "posting_text | llm_runs",
    "user_inputs | job_postings",
    "queue : routing : fields : owners : llm.interface : prompts : migrations : db : config",
]
ignore_imports = [
    # A route may build its response from the posting view: no domain module imports a
    # route module, so this never brings a higher concept into a package's rules
    "job_scout.*.routes -> job_scout.posting_view.*",
]
